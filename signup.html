<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Create Account | Jidderhs Heaven</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #faf8f5;
      --card: #ffffff;
      --text: #25231f;
      --muted: #77736c;
      --accent: #8b6b48;
      --accent-dark: #705338;
      --border: #e9e3da;
      --success: #236b47;
      --error: #b42318;
    }

    body {
      min-height: 100vh;
      padding: 24px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--text);
      font-family: "DM Sans", sans-serif;
    }

    .auth-container {
      width: 100%;
      max-width: 440px;
    }

    .brand {
      text-align: center;
      margin-bottom: 25px;
    }

    .brand a {
      color: var(--text);
      text-decoration: none;
      font-family: "Playfair Display", serif;
      font-size: 30px;
      font-weight: 700;
    }

    .brand p {
      margin-top: 7px;
      color: var(--muted);
      font-size: 13px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .auth-card {
      padding: 32px 28px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 12px 40px rgba(35, 30, 20, 0.06);
    }

    h1 {
      font-family: "Playfair Display", serif;
      font-size: 29px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    .field {
      margin-bottom: 17px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: #fff;
      color: var(--text);
      font: inherit;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(139, 107, 72, 0.12);
    }

    .password-hint {
      margin-top: 6px;
      color: var(--muted);
      font-size: 12px;
    }

    .primary-button {
      width: 100%;
      padding: 14px;
      margin-top: 5px;
      border: none;
      border-radius: 9px;
      background: var(--accent);
      color: #fff;
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, transform 0.2s;
    }

    .primary-button:hover {
      background: var(--accent-dark);
    }

    .primary-button:active {
      transform: scale(0.99);
    }

    .primary-button:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 17px;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .message.success {
      display: block;
      background: #eaf6ee;
      color: var(--success);
    }

    .message.error {
      display: block;
      background: #fff0ee;
      color: var(--error);
    }

    .auth-footer {
      margin-top: 22px;
      text-align: center;
      font-size: 13px;
      color: var(--muted);
      line-height: 1.8;
    }

    .auth-footer a {
      color: var(--accent-dark);
      font-weight: 700;
      text-decoration: none;
    }

    .auth-footer a:hover {
      text-decoration: underline;
    }

    .back-link {
      display: block;
      margin-top: 20px;
      text-align: center;
      color: var(--muted);
      text-decoration: none;
      font-size: 13px;
    }

    @media (max-width: 400px) {
      .auth-card {
        padding: 27px 20px;
      }

      .brand a {
        font-size: 27px;
      }

      h1 {
        font-size: 26px;
      }
    }
  </style>
</head>

<body>
  <main class="auth-container">

    <div class="brand">
      <a href="index.html">Jidderhs Heaven</a>
      <p>Your everyday essentials</p>
    </div>

    <section class="auth-card">
      <h1>Create your account</h1>

      <p class="subtitle">
        Join Jidderhs Heaven for a simpler shopping experience.
      </p>

      <form id="signupForm">

        <div class="field">
          <label for="fullName">Full name</label>
          <input
            type="text"
            id="fullName"
            name="fullName"
            placeholder="Enter your full name"
            autocomplete="name"
            maxlength="100"
            required
          >
        </div>

        <div class="field">
          <label for="email">Email address</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="you@example.com"
            autocomplete="email"
            maxlength="254"
            required
          >
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Create a strong password"
            autocomplete="new-password"
            minlength="8"
            required
          >
          <p class="password-hint">
            Use at least 8 characters.
          </p>
        </div>

        <div class="field">
          <label for="confirmPassword">Confirm password</label>
          <input
            type="password"
            id="confirmPassword"
            name="confirmPassword"
            placeholder="Enter your password again"
            autocomplete="new-password"
            minlength="8"
            required
          >
        </div>

        <button
          type="submit"
          class="primary-button"
          id="signupButton"
        >
          Create Account
        </button>

        <div
          id="signupMessage"
          class="message"
          role="status"
          aria-live="polite"
        ></div>

      </form>

      <div class="auth-footer">
        Already have an account?
        <a href="login.html">Log in</a>
      </div>
    </section>

    <a href="index.html" class="back-link">
      ← Back to shopping
    </a>

  </main>

  <script type="module">
    import { supabase } from "./assets/javascript/supabase.js";

    const signupForm = document.getElementById("signupForm");
    const signupButton = document.getElementById("signupButton");
    const signupMessage = document.getElementById("signupMessage");

    function showMessage(message, type) {
      signupMessage.textContent = message;
      signupMessage.className = "message " + type;
    }

    signupForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      const fullName = document
        .getElementById("fullName")
        .value.trim();

      const email = document
        .getElementById("email")
        .value.trim();

      const password = document
        .getElementById("password")
        .value;

      const confirmPassword = document
        .getElementById("confirmPassword")
        .value;

      if (!fullName) {
        showMessage("Please enter your full name.", "error");
        return;
      }

      if (password.length < 8) {
        showMessage(
          "Your password must contain at least 8 characters.",
          "error"
        );
        return;
      }

      if (password !== confirmPassword) {
        showMessage("Your passwords do not match.", "error");
        return;
      }

      signupButton.disabled = true;
      signupButton.textContent = "Creating account...";

      signupMessage.className = "message";
      signupMessage.textContent = "";

      try {
        const { data, error } = await supabase.auth.signUp({
          email,
          password,
          options: {
            data: {
              full_name: fullName
            },
            emailRedirectTo: window.location.origin + "/login.html"
          }
        });

        if (error) {
          throw error;
        }

        if (data.session) {
          showMessage(
            "Your account has been created successfully. You can now log in.",
            "success"
          );
        } else {
          showMessage(
            "Registration received! Check your email for a verification link. Verify your email before logging in.",
            "success"
          );
        }

        signupForm.reset();

      } catch (error) {
        console.error("Customer registration error:", error);

        showMessage(
          error.message || "Registration failed. Please try again.",
          "error"
        );

      } finally {
        signupButton.disabled = false;
        signupButton.textContent = "Create Account";
      }
    });
  </script>

</body>
</html>
