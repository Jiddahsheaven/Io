<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f8f5ef">
  <title>Reset Password | Jiddahs Heaven</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #f8f5ef;
      color: #29251f;
      font-family: "DM Sans", sans-serif;
    }

    .card {
      width: 100%;
      max-width: 430px;
      padding: 36px 28px;
      background: #fff;
      border: 1px solid #e9e0d4;
      border-radius: 18px;
      box-shadow: 0 12px 40px rgba(41, 37, 31, 0.07);
    }

    .brand {
      margin: 0 0 10px;
      text-align: center;
      font-family: "Playfair Display", serif;
      font-size: 29px;
      font-weight: 600;
    }

    .subtitle {
      margin: 0 0 28px;
      color: #777064;
      text-align: center;
      font-size: 14px;
      line-height: 1.7;
    }

    label {
      display: block;
      margin: 18px 0 8px;
      font-size: 13px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd5c9;
      border-radius: 9px;
      background: #fff;
      color: #29251f;
      font: inherit;
      outline: none;
    }

    input:focus {
      border-color: #94764c;
      box-shadow: 0 0 0 3px rgba(148, 118, 76, 0.12);
    }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 15px;
      border: 0;
      border-radius: 9px;
      background: #30291f;
      color: #fff;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.6;
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .message.error {
      display: block;
      background: #fff0ee;
      color: #a12d23;
    }

    .message.success {
      display: block;
      background: #edf8ef;
      color: #216b35;
    }

    .back {
      display: block;
      margin-top: 22px;
      color: #80623c;
      text-align: center;
      text-decoration: none;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <main class="card">
    <h1 class="brand">Jiddahs Heaven</h1>

    <p class="subtitle">
      Create a new password for your administrator account.
    </p>

    <form id="resetForm">
      <label for="password">New password</label>
      <input
        id="password"
        type="password"
        minlength="8"
        autocomplete="new-password"
        placeholder="At least 8 characters"
        required
      >

      <label for="confirmPassword">Confirm new password</label>
      <input
        id="confirmPassword"
        type="password"
        minlength="8"
        autocomplete="new-password"
        placeholder="Enter the password again"
        required
      >

      <button id="submitButton" type="submit">
        Update Password
      </button>

      <div id="message" class="message" role="status" aria-live="polite"></div>
    </form>

    <a class="back" href="./admin.html">Return to Admin Login</a>
  </main>

  <script type="module">
    import { supabase } from "./assets/javascript/supabase.js";

    const form = document.getElementById("resetForm");
    const passwordInput = document.getElementById("password");
    const confirmInput = document.getElementById("confirmPassword");
    const button = document.getElementById("submitButton");
    const message = document.getElementById("message");

    function showMessage(text, type) {
      message.textContent = text;
      message.className = "message " + type;
    }

    async function initializeRecovery() {
      const url = new URL(window.location.href);
      const params = new URLSearchParams(url.hash.slice(1));

      const recoveryError =
        params.get("error_description") ||
        url.searchParams.get("error_description");

      if (recoveryError) {
        showMessage(
          "The recovery link is invalid or expired. Request a new one when email recovery is available.",
          "error"
        );
        button.disabled = true;
        return;
      }

      const code = url.searchParams.get("code");

      if (code) {
        const { error } = await supabase.auth.exchangeCodeForSession(code);

        if (error) {
          showMessage(
            "The recovery link could not be verified. It may have expired or already been used.",
            "error"
          );
          button.disabled = true;
          return;
        }

        history.replaceState(
          null,
          "",
          window.location.pathname
        );
      }

      const { data, error } = await supabase.auth.getSession();

      if (error || !data.session) {
        showMessage(
          "Open this page using a valid password recovery link from Supabase before updating your password.",
          "error"
        );
        button.disabled = true;
        return;
      }

      button.disabled = false;
    }

    button.disabled = true;

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const password = passwordInput.value;
      const confirmation = confirmInput.value;

      if (password.length < 8) {
        showMessage(
          "Your password must contain at least 8 characters.",
          "error"
        );
        return;
      }

      if (password !== confirmation) {
        showMessage("The passwords do not match.", "error");
        return;
      }

      button.disabled = true;
      button.textContent = "Updating...";

      try {
        const { data, error } = await supabase.auth.updateUser({
          password
        });

        if (error) {
          throw error;
        }

        if (!data.user) {
          throw new Error("The password update could not be confirmed.");
        }

        await supabase.auth.signOut();

        form.reset();

        showMessage(
          "Your password has been updated. You can now return to Admin Login and sign in with your new password.",
          "success"
        );
      } catch (error) {
        showMessage(error.message || "Unable to update your password.", "error");
      } finally {
        button.disabled = false;
        button.textContent = "Update Password";
      }
    });

    initializeRecovery().catch((error) => {
      console.error("Password recovery initialization failed:", error);

      showMessage(
        "Unable to verify the recovery session. Please use a valid recovery link.",
        "error"
      );

      button.disabled = true;
    });
  </script>
</body>
</html>
